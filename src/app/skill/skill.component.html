<p> skill !</p>

<!-- Lister les competences -->
<h1 *ngIf="idmodule">L'ID du module sélectionné : {{ idmodule }}</h1>

<h3>Compétences liées au module</h3>
<ul *ngIf="competences.length > 0">
  <li *ngFor="let competence of competences">
    {{ competence.id }} - : {{ competence.libelle }} - {{ competence.description }}
  </li>
</ul>
<p *ngIf="competences.length === 0">Aucune compétence trouvée pour ce module.</p>

<!-- Ajout d'une competence -->
<label for="question">Entrer la competence :</label><br>
<textarea 
  id="description" 
  [(ngModel)]="description" 
  placeholder="Écrivez votre question ici..." 
  rows="4" 
  cols="50">
</textarea>
<br>

<!-- Bouton pour envoyer la competence -->
<button (click)="sendcomp()">Envoyer</button>

<h3>Compétences liées au module</h3>
<p *ngIf="competences.length === 0">Aucune compétence trouvée pour ce module.</p>

<!-- Suppression d'une competence -->
<div *ngIf="competences.length > 0">
  <label for="competenceSelect">Sélectionner une compétence :</label>
  <select id="competenceSelect" [(ngModel)]="idSkill">
    <option *ngFor="let competence of competences" [value]="competence.id">
      {{ competence.libelle }} - {{ competence.description }}
    </option>
  </select>
  <br><br>
  <button (click)="deletecomp()">Supprimer</button>
</div>
