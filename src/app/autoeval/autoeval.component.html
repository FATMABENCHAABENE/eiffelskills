<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compétences</title>
</head>
<body>
  <div class="decorations">
    <!-- Bulles de décoration -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <!-- Formes géométriques -->
    <div class="shape shape-triangle"></div>
    <div class="shape shape-square"></div>
  </div>

  <div class="container">
    <label class="label">Compétences</label>
    <ul class="skills-list">
      <li class="skill-item" *ngFor="let info of comp">
        <span class="id-span">Compétence: {{ info.description }}</span>

        <!-- Liste déroulante pour l'évaluation -->
        <select class="dropdown" #evalInput>
          <option value="acquired">Acquis</option>
          <option value="acquiring">En cours d'acquisition</option>
          <option value="no acquired">Non acquis</option>
        </select>

        <!-- Bouton d'enregistrement -->
        <button 
          class="save-button" 
          type="button" 
          (click)="updateeval(info.id, evalInput.value)">
          Enregistrer
        </button>
      </li>
    </ul>
  </div>
</body>
</html>
