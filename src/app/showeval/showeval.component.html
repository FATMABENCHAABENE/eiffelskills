<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Évaluations</title>
</head>
<body>
  <div class="decorations">
    <!-- Bulles de décoration -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <!-- Formes géométriques -->
    <div class="shape shape-triangle"></div>
    <div class="shape shape-square"></div>
  </div>

  <div class="container">
    <label class="label">Liste des Évaluations</label>
    <table class="table">
      <thead>
        <tr>
          <th>ID Skill</th>
          <th>Description</th>
          <th>Évaluation</th>
          <th>Quizz Évaluation</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let response of responseMessage">
          <td>{{ response.idSkill }}</td>
          <td>{{ response.description || 'Chargement...' }}</td>
          <td>{{ response.eval }}</td>
          <td>{{ response.quizzeval }}</td>
        </tr>
      </tbody>
    </table>

    <button class="save-button" (click)="loadnotefinale()">Afficher mes notes finales</button>
  </div>

  <div class="resultats-container">
    <label class="label">Résultats des évaluations</label>
    <table class="resultats-table">
      <thead>
        <tr>
          <th>Description</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let resultat of resultats">
          <td>{{ resultat.description }}</td>
          <td>{{ resultat.note }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
