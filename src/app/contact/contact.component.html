
<div class="container">
    
</div>
<div class="contact-container">
    <form (ngSubmit)="envoyerFormulaire()" #contactForm="ngForm">
      <p>Tout au plaisir de vous repondre !</p>
      <div class="form-group">
        <input
          type="text"
          id="name"
          name="name"
          required
          [(ngModel)]="contact.name"
          class="form-control"
          placeholder="Prénom"
        />
      </div>
      <div class="form-group">
        <input
          type="text"
          id="surname"
          name="surname"
          required
          [(ngModel)]="contact.surname"
          class="form-control"
          placeholder="Nom"
        />
      </div>
      <div class="form-group">
        <input
          type="mail"
          id="mail"
          name="mail"
          required
          [(ngModel)]="contact.mail"
          class="form-control"
          placeholder="Mail"
        />
      </div>
      <div class="form-group">
        <textarea
          id="message"
          name="message"
          required
          [(ngModel)]="contact.message"
          class="form-control"
          class="send send_majeure"
          placeholder="Votre message"
        ></textarea>
      </div>
      <button type="submit" class="btn btn-submit" class="send send_majeure">Envoyer</button>
    </form>
  </div>
