<p>Tout au plaisir de vous repondre !</p>

<div class="container">
    
</div>
<div class="contact-container">
    <form (ngSubmit)="envoyerFormulaire()" #contactForm="ngForm">
      <div class="form-group">
        <label for="name">name</label>
        <input
          type="text"
          id="name"
          name="name"

          required
          [(ngModel)]="contact.name"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="surname">Surname</label>
        <input
          type="text"
          id="surname"
          name="surname"
          required
          [(ngModel)]="contact.surname"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="mail">Mail</label>
        <input
          type="mail"
          id="mail"
          name="mail"
          required
          [(ngModel)]="contact.mail"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="message">Votre message</label>
        <textarea
          id="message"
          name="message"
          required
          [(ngModel)]="contact.message"
          class="form-control"
        ></textarea>
      </div>
      <button type="submit" class="btn btn-submit">Envoyer</button>
    </form>
  </div>
